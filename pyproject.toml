[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agents"
version = "0.1.0"
description = ""
authors = [{name = "PNWSquad"}]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "vllm",
    "tqdm",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "langchain-core",
    "langchain-google-genai",
    "torch",
    "pyyaml",
    "google-genai",
    "google-auth",
    "openai",
    "cerebras-cloud-sdk",
    "neo4j",
    "transformers",
    "weaviate-client",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pyjwt>=2.8",
    "bcrypt>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
