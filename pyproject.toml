[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agents"
version = "0.1.0"
description = ""
authors = [{name = "PNWSquad"}]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "vllm",
    "tqdm",
    "pydantic",
    "python-dotenv",
    "langchain-core",
    "langchain-google-genai",
    "torch",
    "pyyaml"
]

[tool.setuptools.packages.find]
where = ["src"]