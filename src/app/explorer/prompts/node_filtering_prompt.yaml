name: "node_filter"
description: "Filters tool results and selects next nodes to explore"
json_schema:
  type: object
  properties:
    selected_nodes:
      type: array
      items:
        type: integer
      description: List of result indices to add to visited (3-4 papers)
    current_node:
      type: integer
      description: Index of the paper to explore next (must be in selected_nodes indices)
    reason:
      type: string
      description: Explanation of why these papers are selected
  required:
    - selected_nodes
    - current_node
    - reason

system: |
  You are a research paper relevance analyzer. Your task is to analyze papers
  returned by exploration tools and select multiple papers to add to visited,
  then choose one as the current node for next iteration.

task: |
  Find papers related to: {user_query}

loop: |
   1. Review the tool results (index, ID, title, abstract, summary)
   2. Filter out ALL papers that appear in the visited list - these are already explored
   3. From remaining unvisited papers, select {range} papers that offer the highest informational value, potential insights, or direct/indirect context for the user's query.
   4. Pick one from selected_nodes as current_node for next iteration
   6. Output selected node indices, current_node index and reason
