pipeline:
  refinement_turns: 0  # number of retriever<->generator refinement rounds (0 = single pass)
  save_steps: false     # save intermediate results to disk
  save_dir: "outputs"   # directory for saved step outputs (relative to project root)

api_client:
  type: "google"
  model: "gemini-3-flash-preview"

search:
  type: "weaviate"     # weaviate: vector search for paper IDs
  weaviate:
    top_k: 20                          # number of initial results before reranking
    rerank_top_k: 10                   # number of results after reranking

explorer:
  type: "neo4j_bfs"    # neo4j_bfs, neo4j_random_walk, neo4j_pagerank, agentic, weaviate (existing)
  neo4j:
    max_level: 2       # for BFS: maximum depth of traversal
    direction: "both"  # outgoing, incoming, or both
    # for Random Walk:
    steps: 10          # number of steps for random walk
    # for PageRank:
    top_n: 15          # number of top results from PageRank
    max_iterations: 20
    damping_factor: 0.85
  agentic:
    iterations: 5
    tools: ["bfs_from_papers", "random_walk", "ppr"]
    tool_selection_prompt: "tool_selection_prompt.yaml"
    node_filtering_prompt: "node_filtering_prompt.yaml"
    model_name: "Qwen/Qwen3-4B"
    temperature: 0.7
    max_results_per_tool: 10
    include_abstracts: true
    include_summary: false
    selected_nodes_count_low: 2
    selected_nodes_count_high: 3
  weaviate:
    url: "http://localhost:8080"
    collection: "ResearchPapers"
    top_k: 10
    embedding_model: "Qwen/Qwen3-Embedding-4B"
    max_tokens: 8192
    grpc_port: 50051
  const_text: "No knowledge graph connected. Using placeholder context."

retriever:
  type: "llm"
  top_k: 5

generator:
  type: "llm"
  temperature: 0.7